name: Demo image

on:
  push:
    tags:
      - demo

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  image:
    name: Build and push demo image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for the matching CI run
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 120); do
            response=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=10")
            run=$(jq -c --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | first' <<<"$response")
            if [[ "$run" != null ]]; then
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" != success ]]; then
                  echo "Matching CI run finished with $conclusion" >&2
                  exit 1
                fi
                run_id=$(jq -r '.id' <<<"$run")
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 30
          done
          echo "Timed out waiting for CI at $GITHUB_SHA" >&2
          exit 1

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: wafred-main-binary
          path: docker-context/
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          chmod +x docker-context/wafred
          cp wafred.toml docker-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-context/
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/oyport/wafred:demo
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/oyport/wafred
            org.opencontainers.image.revision=${{ github.sha }}
