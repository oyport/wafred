name: Demo image

on:
  push:
    tags:
      - demo

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push demo image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_USER: wafred_test
          POSTGRES_PASSWORD: local-test-password
          POSTGRES_DB: wafred_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wafred_test -d wafred_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev cmake libclang-dev pkg-config libssl-dev nasm

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: demo-release-binary

      - name: Build binary
        env:
          PROTOC: /usr/bin/protoc
          RUSTFLAGS: -C target-cpu=x86-64
          CFLAGS: -march=x86-64 -mtune=generic -mno-avx -mno-avx2
          CXXFLAGS: -march=x86-64 -mtune=generic -mno-avx -mno-avx2
        run: cargo build --locked --release --bin wafred --features full

      - name: Test initial setup and account restrictions
        run: bash scripts/test-demo-bootstrap.sh "$PWD/target/release/wafred"

      - name: Prepare build context
        run: |
          mkdir -p docker-context
          cp target/release/wafred docker-context/
          chmod +x docker-context/wafred
          cp wafred.toml docker-context/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker-context/
          file: ./Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/oyport/wafred:demo
          cache-from: type=gha,scope=docker
          cache-to: type=gha,scope=docker,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/oyport/wafred
            org.opencontainers.image.revision=${{ github.sha }}
