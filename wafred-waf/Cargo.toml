[package]
name = "wafred-waf"
version.workspace = true
edition = "2021"
description = "WAFred detection engine: normalization, signature matching, rule evaluation and anomaly scoring"
license = "Apache-2.0"

[dependencies]
# Self-accounting only (module/method timers and memory gauges); no allocator
# hook, no sampling, so it is safe on the detection hot path.
wafred-profiler = { path = "../wafred-profiler" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# The workspace declares regex with default-features = false; the detection
# engine needs the std backend plus Unicode-aware case folding for `(?i)`.
#
# `perf` is spelled out on purpose: without it the regex crate falls back to
# the PikeVM (no lazy DFA, no literal prefilter), which measured 17-49x slower
# on this crate's detector battery. The shipped `wafred` binary happened to
# enable it through feature unification with `pingora-cache`'s default regex
# dependency, so a waf-only build (tests, examples, downstream users) silently
# ran the slow path, and any upstream change to that dependency would have
# degraded production the same way without a compile error. Keep this feature
# list explicit.
regex = { workspace = true, features = [
    "std",
    "unicode-case",
    "unicode-perl",
    "perf",
] }
ahash = { workspace = true }
aho-corasick = "1"
base64 = { workspace = true }
# Request bodies arrive `Content-Encoding: gzip` / `deflate` often enough
# that inspecting the encoded bytes means inspecting nothing. Bounded,
# in-memory decompression only (see `normalize::body`).
flate2 = { workspace = true }
ipnet = { workspace = true }
bytes = { workspace = true }
once_cell = "1"
