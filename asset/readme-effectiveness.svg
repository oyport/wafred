      <rect x="270" y="472" width="620" height="19" rx="4"/>
      <rect x="270" y="508" width="620" height="19" rx="4"/>
    </g>
    <g>
      <rect x="270" y="76" width="595.5" height="19" rx="4" fill="#d8324f"/>
      <rect x="270" y="112" width="581.6" height="19" rx="4" fill="#a7833a"/>
      <rect x="270" y="148" width="472.1" height="19" rx="4" fill="#d8324f"/>
