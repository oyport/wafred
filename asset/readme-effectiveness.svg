<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">WAFred 1.0.4 compared with prior PingWAF results and firewall references</title>
  <desc id="desc">Current corrected WAFred measurements for four policy tiers, paired with the earlier PingWAF P13 results and historical SafeLine, ModSecurity and Cloudflare references.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171717" stroke-width="1"/></pattern>
  </defs>
  <rect width="1000" height="650" fill="#101010"/>
  <rect width="1000" height="650" fill="url(#grid)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="34" fill="#e8e8e8" font-size="15" font-weight="700">WAFred 1.0.4 · prior PingWAF run · firewall references</text>
    <text x="30" y="53" fill="#8d8d8d" font-size="10">Interception rate · current WAFred uses corrected body framing · same nominal corpus: 658 attacks</text>
    <g font-size="10.5" fill="#c8c8c8">
      <text x="30" y="90" fill="#ffb9c5" font-weight="700">WAFred Strict + body</text>
      <text x="30" y="126" fill="#d3ad64">PingWAF prior P13 Strict + body</text>
      <text x="30" y="162" fill="#ffb9c5" font-weight="700">WAFred Strict</text>
      <text x="30" y="198" fill="#d3ad64">PingWAF prior P13 Strict</text>
      <text x="30" y="234" fill="#ffb9c5" font-weight="700">WAFred Normal + body</text>
      <text x="30" y="270" fill="#d3ad64">PingWAF prior P13 Normal + body</text>
      <text x="30" y="306" fill="#ffb9c5" font-weight="700">WAFred Normal</text>
      <text x="30" y="342" fill="#d3ad64">PingWAF prior P13 Normal</text>
      <text x="30" y="378">ModSecurity PL4</text>
      <text x="30" y="414">SafeLine free · strict</text>
      <text x="30" y="450">SafeLine free · balanced</text>
      <text x="30" y="486">ModSecurity PL1</text>
      <text x="30" y="522">Cloudflare free</text>
    </g>
    <g fill="#252525">
      <rect x="270" y="76" width="620" height="19" rx="4"/>
      <rect x="270" y="112" width="620" height="19" rx="4"/>
      <rect x="270" y="148" width="620" height="19" rx="4"/>
