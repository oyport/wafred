    <text x="270" y="544" fill="#8d8d8d" font-size="9">0%</text>
    <text x="885" y="544" fill="#8d8d8d" font-size="9">100%</text>
    <text x="30" y="566" fill="#c6b7bd" font-size="9.5">WAFred Strict + body: 632/658 intercepted · 19/33,219 benign affected (0.057%).</text>
    <text x="30" y="586" fill="#d3ad64" font-size="9">Prior PingWAF P13 Strict + body: 617/658 (93.8%) · 21 benign affected (0.063%).</text>
    <text x="30" y="606" fill="#8d8d8d" font-size="9">Prior replay framing differed and had 15 framing-related HTTP 500s; current WAFred uses corrected framing.</text>
    <text x="30" y="626" fill="#8d8d8d" font-size="9">Other firewall values are historical; corpus and network paths differ. p95 is not directly comparable.</text>
  </g>
